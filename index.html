<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a1220">
<title>小索 · 深求者</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 45%,#0d1b2e 0%,#05080f 72%);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;touch-action:none;background:#060a12;box-shadow:0 0 40px rgba(20,80,130,.35);}
  #pad{position:fixed;inset:0;pointer-events:none;display:none;}
  #pad.on{display:block;}
  .stick{position:absolute;left:22px;bottom:22px;width:112px;height:112px;border-radius:50%;
    border:2px solid rgba(120,200,255,.28);background:rgba(10,30,50,.35);pointer-events:auto;}
  .stick i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#7fe4ff,#1c6ea8);box-shadow:0 0 14px rgba(80,220,255,.6);}
  .btn{position:absolute;width:78px;height:78px;border-radius:50%;pointer-events:auto;
    display:flex;align-items:center;justify-content:center;font-size:13px;letter-spacing:1px;
    color:#bfeaff;border:2px solid rgba(120,200,255,.35);background:rgba(12,34,56,.55);
    text-shadow:0 0 8px rgba(80,220,255,.8);}
  #btnJump{right:24px;bottom:24px;width:88px;height:88px;font-size:15px;}
  #btnShot{right:120px;bottom:20px;}
  #btnDash{right:24px;bottom:120px;width:64px;height:64px;font-size:12px;}
  #btnThink{right:110px;bottom:106px;width:60px;height:60px;font-size:11px;opacity:.85;}
  .btn:active{background:rgba(40,120,190,.75);transform:scale(.94);}
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="pad">
  <div class="stick" id="stick"><i id="knob"></i></div>
  <div class="btn" id="btnJump">跳</div>
  <div class="btn" id="btnShot">弹</div>
  <div class="btn" id="btnDash">冲撞</div>
  <div class="btn" id="btnThink">思考</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
